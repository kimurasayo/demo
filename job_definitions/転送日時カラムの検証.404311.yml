---
id: 404311
name: 転送日時カラムの検証
description: ''
user:
  id: 6335
  email: sayo.kimura+demo@primenumber.co.jp
transfer_option:
  transfer_type: normal
  in:
    type: s3
    s3_connection:
      id: 668
      name: csdemo-AmazonS3
    region: ap-northeast-1
    bucket: trocco-test-kimura
    path_prefix: '20251211'
    path_match_pattern: "$file$"
    decompression_type: guess
    skip_header_line: false
    stop_when_file_not_found: true
    custom_variables:
    - type: string
      name: "$file$"
      value: 251211_utf8.csv
    - type: timestamp
      name: "$date$"
      quantity: 0
      unit: hour
      direction: ago
      time_zone: Etc/UTC
      format: "%Y-%m-%d %H:%M:%S"
    incremental_loading_enabled: false
    parser:
      type: csv
      delimiter: ","
      skip_header_lines: 1
      trim_if_not_quoted: false
      quotes_in_quoted_fields: ACCEPT_ONLY_RFC4180_ESCAPED
      allow_optional_columns: false
      allow_extra_columns: false
      max_quoted_size_limit: 131072
      stop_on_invalid_record: true
      default_timezone: UTC
      default_date: '1970-01-01'
      newline: LF
      charset: UTF-8
      columns:
      - name: id
        type: long
      - name: name
        type: string
      - name: 電話番号
        type: string
      - name: その他
        type: string
      quote: "\""
      escape: "\""
    decoders: []
  out:
    type: bigquery
    bigquery_connection:
      id: 761
      name: csdemo-BigQuery
    dataset: kimura_test
    table: '251211_2'
    auto_create_dataset: false
    mode: append
    location: asia-northeast1
    open_timeout_sec: 300
    timeout_sec: 300
    send_timeout_sec: 300
    read_timeout_sec: 300
    retries: 5
    allow_quoted_newlines: true
    column_options: []
    template_table: ''
    custom_variables: []
  data_settings:
    columns:
    - name: id
      src: id
      default: ''
      type: long
    - name: name
      src: name
      default: ''
      type: string
    - name: tel
      src: 電話番号
      default: ''
      type: string
    - name: other
      src: その他
      default: ''
      type: string
    - name: custom_date
      src: ''
      default: "$date$"
      type: timestamp
      format: "%Y-%m-%d %H:%M:%S"
    transfered_time_column:
      column_name: time
  is_runnable_concurrently: false
  retry_limit: 0
labels: []
job_schedules: []
notifications: []
