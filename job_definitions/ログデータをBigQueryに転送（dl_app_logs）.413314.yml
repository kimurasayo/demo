---
id: 413314
name: ログデータをBigQueryに転送（dl_app_logs）
description: ''
user:
  id: 6335
  email: sayo.kimura+demo@primenumber.co.jp
transfer_option:
  transfer_type: normal
  in:
    type: s3
    s3_connection:
      id: 668
      name: csdemo-AmazonS3
    region: ap-northeast-1
    bucket: trocco-test-kimura
    path_prefix: '20251219'
    path_match_pattern: ''
    decompression_type: guess
    skip_header_line: false
    stop_when_file_not_found: false
    custom_variables: []
    incremental_loading_enabled: false
    parser:
      type: jsonpath
      root: "$"
      default_timezone: UTC
      columns:
      - name: id
        type: long
      - name: product
        type: string
      - name: shop
        type: json
      - name: priority
        type: long
      - name: origin
        type: json
      - name: date
        type: timestamp
        format: "%Y-%m-%dT%H:%M:%S%z"
    decoders: []
  out:
    type: bigquery
    bigquery_connection:
      id: 761
      name: csdemo-BigQuery
    dataset: kimura_test
    table: dl_app_logs
    auto_create_dataset: false
    mode: append
    location: asia-northeast1
    open_timeout_sec: 300
    timeout_sec: 300
    send_timeout_sec: 300
    read_timeout_sec: 300
    retries: 5
    allow_quoted_newlines: true
    column_options: []
    template_table: ''
    custom_variables: []
  data_settings:
    columns:
    - name: id
      src: id
      default: ''
      type: long
    - name: product
      src: product
      default: ''
      type: string
    - name: shop
      src: shop
      default: ''
      type: json
    - name: priority
      src: priority
      default: ''
      type: long
    - name: origin
      src: origin
      default: ''
      type: json
    - name: date
      src: date
      default: ''
      type: timestamp
      format: "%Y-%m-%dT%H:%M:%S%z"
  is_runnable_concurrently: false
  retry_limit: 0
labels: []
job_schedules: []
notifications: []
