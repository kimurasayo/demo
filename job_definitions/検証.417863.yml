    query: |-
      SELECT
        ID,
        CASE
          WHEN EXTRACT(YEAR FROM DT) < 1000 THEN
            TO_DATE(
              LPAD(EXTRACT(YEAR FROM DT) + 1000, 4, '0')
              || TO_CHAR(DT, '-MM-DD HH24:MI:SS'),
              'YYYY-MM-DD HH24:MI:SS'
            )
          ELSE DT
        END AS DT
      FROM KIMURA_DATE_TEST;
