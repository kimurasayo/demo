id: 395583
name: timestampの検証
description: ''
user:
  id: 6335
  email: sayo.kimura+demo@primenumber.co.jp
transfer_option:
  transfer_type: normal
  in:
    type: s3
    s3_connection:
      id: 668
      name: csdemo-AmazonS3
    region: ap-northeast-1
    bucket: trocco-test-kimura
    path_prefix: 251111/
    path_match_pattern: ''
    decompression_type: guess
    skip_header_line: false
    stop_when_file_not_found: false
    custom_variables: []
    incremental_loading_enabled: false
    parser:
      type: csv
      delimiter: ","
      skip_header_lines: 1
      trim_if_not_quoted: false
      quotes_in_quoted_fields: ACCEPT_ONLY_RFC4180_ESCAPED
      allow_optional_columns: false
      allow_extra_columns: false
      max_quoted_size_limit: 131072
      stop_on_invalid_record: true
      default_timezone: UTC+09:00
      default_date: '1970-01-01'
      newline: LF
      charset: ISO-8859-2
      columns:
      - name: c0
        type: timestamp
        format: "%Y/%m/%d"
      - name: c1
        type: string
      - name: c2
        type: long
      quote: "\""
      escape: "\""
    decoders: []
  out:
    type: bigquery
    bigquery_connection:
      id: 761
      name: csdemo-BigQuery
    dataset: kimura_test
    table: 1111_timestamp
    auto_create_dataset: false
    mode: replace
    location: asia-northeast1
    open_timeout_sec: 300
    timeout_sec: 300
    send_timeout_sec: 300
    read_timeout_sec: 300
    retries: 5
    allow_quoted_newlines: true
    column_options: []
    template_table: ''
    retain_column_descriptions: false
    retain_column_policy_tags: false
    custom_variables: []
  data_settings:
    columns:
    - name: c0
      src: c0
      default: ''
      type: timestamp
      format: "%Y/%m/%d"
    - name: c1
      src: c1
      default: ''
      type: string
    - name: c2
      src: c2
      default: ''
      type: long
    row_filters:
      condition: and
      conditions:
      - column: c0
        operator: ">"
        argument: '2025-11-01'
  is_runnable_concurrently: false
  retry_limit: 0
labels: []
job_schedules: []
notifications: []
