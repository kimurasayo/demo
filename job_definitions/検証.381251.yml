    custom_variables: []
    formatter:
      type: csv
      delimiter: ","
      newline: CRLF
      newline_in_field: LF
      charset: UTF-8
      quote_policy: MINIMAL
      quote: "\""
      escape: "\\"
      header_line: true
      default_timezone: UTC
    encoders:
  data_settings:
    columns:
    - name: id
      src: id
      default: ''
      type: long
    - name: name
      src: name
      default: ''
      type: string
    - name: mail
      src: mail
      default: ''
      type: string
    - name: birthday
      src: birthday
      default: ''
      type: timestamp
      format: ''
    - name: rank
      src: rank
      default: ''
      type: string
    row_filters:
      condition: and
      conditions:
      - column: id
        operator: ">"
        argument: '2'
